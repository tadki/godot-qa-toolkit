[project]
name = "godot-qa-toolkit"
version = "0.1.0"
description = "Deterministic five-stage QA toolchain for Godot/GDScript: Gherkin runner, complexity gate, mutation and coverage (SEE-1256 plan, M1)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "gdtoolkit>=4.3",
]

[project.optional-dependencies]
test = [
    # SEE-1516 CI 钉版（Owner 依赖政策 2026-11-04：沿用当前可用版本不升级）：
    # pytest-bdd 9.0.0 与 pytest 9.2.0 私有 API 不兼容（FixtureManager
    # ._arg2fixturedefs 移除导致 INTERNALERROR）。10-27 master 全绿时 CI
    # 实装 pytest 9.1.1，11-04 起 pip 解析到 9.2.0 即全红，与代码改动无关。
    "pytest>=8,<9.2",
    "pytest-bdd==9.0.0",
    "pytest-json-report>=1.5,<2",
    "pytest-timeout==2.4.0",
]

[project.scripts]
gqt = "godot_qa_toolkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# SEE-1308 §SPEC-003: importlib mode (with the tests/__init__.py package
# already present) makes pytest resolve imports by module path instead of
# honouring a stale `__editable__` egg-link that may root at a *different*
# worktree on a multi-workdir box, which would make pytest spuriously fail.
# Belt #2 is the PYTHONPATH convention documented in README.
addopts = "-q --import-mode=importlib"
bdd_features_base_dir = "."
