[project]
name = "godot-qa-toolkit"
version = "0.1.0"
description = "Deterministic five-stage QA toolchain for Godot/GDScript: Gherkin runner, complexity gate, mutation and coverage (SEE-1256 plan, M1)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "gdtoolkit>=4.3",
]

[project.scripts]
gqt = "godot_qa_toolkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
# SEE-1308 §SPEC-003: `--import-mode=importlib` (with the tests/__init__.py
# package already present) makes pytest resolve imports by module path instead
# of honouring a stale `__editable__` egg-link that may point at a *different*
# workdir. On a box with several KOL worktrees sharing the same Python
# site-packages the egg-link can root at an old checkout, so
# `import godot_qa_toolkit` inside the test process resolves to the wrong tree
# and pytest spuriously fails. importlib mode + the PYTHONPATH convention in
# README is the double-belt fix.
