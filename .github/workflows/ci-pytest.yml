# pytest unit CI — qa-toolkit 自测层（SEE-1292 AC-DECPL-005/006 前置）
# 纯 Python 工具自测：9 个测试文件 65 项，零 Godot 依赖（mutation/coverage 的
# GUT 路径在单测里全部 mock）。见 docs/ci-cache-matrix.md 的归属判据与缓存矩阵。
name: ci-pytest

concurrency:
  group: ci-pytest-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip (gdtoolkit wheel)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.12-

      - name: Install
        run: pip install -e . pytest

      - name: Run unit tests
        run: python -m pytest tests/ -q

      # Complexity gate（SEE-1309 SPEC-006）：gqt 消费自家工具作质量门。
      # 判据：tests/fixtures/complex.gd（max cc=6）在 --warn 10 --max 15 下 exit 0。
      - name: Complexity gate (self-consumed)
        run: gqt complexity tests/fixtures/complex.gd --warn 10 --max 15
