# .dev/tests CI — repo-sync dev tool chain self-tests (SEE-1406).
# Pure Python + temp git repos; no Godot dependency.
name: ci-devtests

concurrency:
  group: ci-devtests-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest-devtests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      # SEE-1430b M1: repo-sync suites migrated to tadki/dev-forge tests/repo-sync/
      # (run in dev-forge CI); this repo's .dev/tests tree is retired — collection
      # is zero by design, step removed rather than left failing.
      - name: Repo-sync suites migrated to dev-forge (no-op marker)
        run: echo "repo-sync suites live in tadki/dev-forge tests/repo-sync/ (SEE-1430b M1)"
