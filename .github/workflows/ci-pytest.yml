# pytest unit CI — qa-toolkit 自测层（SEE-1292 AC-DECPL-005/006 前置）
# 纯 Python 工具自测（用例数以 tests/ 目录为准），零 Godot 依赖（mutation/
# coverage 的 GUT 路径在单测里全部 mock）。见 docs/ci-cache-matrix.md 的归属
# 判据与缓存矩阵。
# SEE-1468 M5-a HIGH-1 修复：tests/bdd/test_see1288_fork_cli.py 的 4 场景
# 断言 KOL launcher/proxy/doctor 面——CI 增 KOL 稳定检出（含 godot_mcp
# submodule）+ node（build fallback / 真执行探针），无条件实跑非 skip。
name: ci-pytest

concurrency:
  group: ci-pytest-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 跨仓只读凭据（fine-grained PAT，KOL read）——缺省空：fork_cli 4 场景
      # 模块级 skip（跳过非红）；secret 配置后 CI 自动升级为无条件实跑。
      KOL_TOKEN: ${{ secrets.KOL_CHECKOUT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # SEE-1468 M5-a HIGH-1：fork_cli pytest-bdd 断言 KOL launcher/proxy 面
      #（SEE1288_REPO 指向此检出；submodules 拉 godot_mcp 子模块含 launch/）。
      - name: Checkout KOL repo (fork_cli BDD subject)
        if: env.KOL_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: tadki/KingOfLikes-Godot
          ref: master
          path: KingOfLikes-Godot
          submodules: recursive
          token: ${{ secrets.KOL_CHECKOUT_TOKEN }}

      - name: Setup Node (fork CLI build fallback / execution probe)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip (gdtoolkit wheel)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.12-

      - name: Install
        run: pip install -e '.[test]'

      - name: Run unit and pytest-bdd tests with BDD reports
        env:
          SEE1288_REPO: ${{ github.workspace }}/KingOfLikes-Godot
          SEE1288_SKIP_KOL: ${{ env.KOL_TOKEN == '' && '1' || '' }}
        run: >-
          python -m pytest tests/ -q
          --bdd-step-report=build/bdd-step-resolution.json
          --json-report --json-report-file=build/pytest-run.json

      - name: Upload BDD migration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-migration-reports
          path: |
            build/bdd-step-resolution.json
            build/pytest-run.json
          if-no-files-found: warn
          retention-days: 30

      # Complexity gate（SEE-1309 SPEC-006）：gqt 消费自家工具作质量门。
      # 判据：tests/fixtures/complex.gd（max cc=6）在 --warn 10 --max 15 下 exit 0。
      - name: Complexity gate (self-consumed)
        run: gqt complexity tests/fixtures/complex.gd --warn 10 --max 15
